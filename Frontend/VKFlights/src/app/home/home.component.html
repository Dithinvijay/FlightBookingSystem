<img src="assets/homepageflight.jpg" alt="Plane" class="hero-banner-img" />
<section class="hero">
  <div class="hero-content">
    <div class="hero-text">
      <h1>Discover Your Next Adventure</h1>
      <p>Find and book your perfect flight with our best-in-class booking system</p>
    </div>
    
    <div class="flight-card">
      <div class="search-note">
        Search for the dates between 01-04-2026 to 03-04-2026
      </div>
      <div class="flight-fields enhanced-fields">
        <div class="field-row">
          <div class="field">
            <label>
              <i class="fas fa-plane-departure"></i>
              From
            </label>
            <select [(ngModel)]="fromValue" (change)="onFieldChange()" [class.error]="fromError" style="width: auto;">
              <option value="">Select departure city</option>
              <option *ngFor="let city of cities" [value]="city">{{ city }}</option>
            </select>
            <div *ngIf="fromError" class="validation-error">{{ fromError }}</div>
          </div>
          
          <div class="field-separator">
            <button class="swap-btn" (click)="swapFromTo()">
              <i class="fas fa-exchange-alt"></i>
            </button>
          </div>

          <div class="field">
            <label>
              <i class="fas fa-plane-arrival"></i>
              To
            </label>
            <select [(ngModel)]="toValue" (change)="onFieldChange()" [class.error]="toError" style="width: auto;">
              <option value="">Select destination city</option>
              <option *ngFor="let city of cities" [value]="city">{{ city }}</option>
            </select>
            <div *ngIf="toError" class="validation-error">{{ toError }}</div>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>
              <i class="fas fa-calendar"></i>
              Departure
            </label>
            <input type="date" required [(ngModel)]="dateValue" [min]="(todayDateString || '')" (change)="onFieldChange()" [class.error]="dateError" />
            <div *ngIf="dateError" class="validation-error">{{ dateError }}</div>
          </div>
          <div class="field">
            <label>
              <i class="fas fa-user-friends"></i>
              Travelers & Class
            </label>
            <select>
              <option>1 Adult, Economy</option>
              <option>2 Adults, Economy</option>
              <option>1 Adult, Business</option>
            </select>
          </div>
        </div>
      </div>

      <button class="search-btn animated-search-btn"
        [class.active]="isActive"
        [class.finished]="isFinished"
        (click)="onAnimatedSearchClick()">
        <span class="submit" *ngIf="!isFinished"><i class="fas fa-search"></i> Search Flights</span>
        <span class="loading" *ngIf="isActive && isLoading"><i class="fas fa-sync fa-spin"></i></span>
        <span class="check" *ngIf="isFinished"><i class="fas fa-check"></i></span>
      </button>
      
      <div *ngIf="searchError" class="prompt-message">{{ searchError }}</div>
    </div>

    <div class="hero-features">
      <div class="feature">
        <i class="fas fa-shield-alt"></i>
        <span>Secure Booking</span>
      </div>
      <div class="feature">
        <i class="fas fa-tag"></i>
        <span>Best Prices</span>
      </div>
      <div class="feature">
        <i class="fas fa-clock"></i>
        <span>24/7 Support</span>
      </div>
    </div>
  </div>
</section>
