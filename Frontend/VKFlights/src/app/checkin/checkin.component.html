<section class="checkin-section">
  <div class="checkin-card">
    <h2 class="checkin-title"><i class="fa-solid fa-user-check"></i> Flight Check-In</h2>
    <form [formGroup]="checkinForm" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <label>Passenger ID</label>
        <input formControlName="passengerId" type="number" placeholder="Enter Passenger ID" required />
        <div *ngIf="checkinForm.get('passengerId')?.invalid && checkinForm.get('passengerId')?.touched" class="error-message">
          <span *ngIf="checkinForm.get('passengerId')?.errors?.['required']">Passenger ID is required</span>
          <span *ngIf="checkinForm.get('passengerId')?.errors?.['pattern']">Passenger ID must be a number with maximum 5 digits</span>
        </div>
      </div>
      <button class="checkin-btn" type="submit" [disabled]="loading || checkinForm.invalid">
        <span *ngIf="!loading">Check In</span>
        <span *ngIf="loading"><i class="fa fa-spinner fa-spin"></i> Checking In...</span>
      </button>
    </form>
  </div>
</section>

<div class="toast-container">
  <div class="toast" [class.show]="(toastService.toast$ | async)?.show" [class.error]="(toastService.toast$ | async)?.type === 'error'">
    <i class="fa" [class.fa-check-circle]="(toastService.toast$ | async)?.type === 'success'" [class.fa-exclamation-circle]="(toastService.toast$ | async)?.type === 'error'"></i>
    {{ (toastService.toast$ | async)?.message }}
  </div>
</div>
